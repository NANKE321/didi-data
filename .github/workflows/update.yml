name: 数据更新
on:
  push:
    paths:
      - uploads/*.xls
      - uploads/*.xlsx
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: *** secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install xlrd openpyxl requests
      - run: python scripts/convert.py
      - name: 推送数据
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data.json
          git diff --staged --quiet || git commit -m 'data: 自动更新'
          git push
      - name: 同步小程序
        env:
          SECRET: *** secrets.APPSECRET }}
          ENV: cloud1-d9ga0w2uj0e2de7bd
        run: python scripts/sync_cloud.py
      - name: 清理
        if: always()
        run: |
          rm -f uploads/*.xls uploads/*.xlsx
          git add uploads/
          git diff --staged --quiet || git commit -m 'chore: 清理'
          git push || true
